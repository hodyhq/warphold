name: HTMLUI
on:
  pull_request:
    branches: [ master ]
  push:
    # ci-sandbox is a branch dedicated to testing post-submit code.
    branches: [ master, artifacts-pr ]
    tags:
      - v*
env:
  # environment variables shared between build steps
  # do not include sensitive credentials and tokens here, instead pass them
  # directly to tools that need them to limit the blast radius in case one of them
  # becomes compromised and leaks credentials to external sites.
  # required by Makefile
  UNIX_SHELL_ON_WINDOWS: true
  # set (to any value other than false) to trigger random unicode filenames testing (logs may be difficult to read)
  ENABLE_UNICODE_FILENAMES: ${{ secrets.ENABLE_UNICODE_FILENAMES }}
  # disable long filenames since they sometimes get messed up when simulating input keystrokes
  ENABLE_LONG_FILENAMES: false
  # warphold: this suite drives Kopia's original "connect to a repository"
  # first-run screen, which WarpHold's UI no longer shows first -- see the
  # htmlui-e2e-test target in the root Makefile for the root cause and the
  # Plan 4 follow-up to port the harness.
  WARPHOLD_SKIP_HTMLUI_E2E: "true"
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
# warphold: this workflow only builds and drives a browser against a local
# server; it publishes nothing and needs no write scope. lint.yml already
# pins its own permissions this way.
permissions:
  contents: read
jobs:
  end-to-end-test:
    name: E2E Test
    runs-on: macos-latest
    steps:
    - name: Check out repository
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        fetch-depth: 0
    - name: Set up Go
      uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      with:
        go-version-file: 'go.mod'
        check-latest: true
      id: go
    - name: Install gotestsum
      run: make install-gotestsum
    # warphold: the suite itself is skipped (WARPHOLD_SKIP_HTMLUI_E2E above)
    # until it's ported to WarpHold's Fleet-activation first-run UI. Kept
    # pinned, rather than dropped, so it stays ready to run the moment that
    # port lands: the action's default channel ("stable") is a moving
    # target, which would leave version drift to debug all over again.
    - name: Set up Chrome
      uses: browser-actions/setup-chrome@48ad923757ca74d66703209fe939badbdf80f2f4 # v2.2.0
      with:
        chrome-version: '152.0.7977.82'
    - name: Run Tests
      run: make htmlui-e2e-test
    - name: Upload Screenshots
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        path: .screenshots/**/*.png
        if-no-files-found: ignore
      if: ${{ always() }}
