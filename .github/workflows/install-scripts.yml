# warphold: the one-command installers ship with the code they install, so
# they are linted and exercised against this tree on every change.
name: Install scripts
on:
  pull_request:
    branches: [ master ]
  push:
    branches: [ master ]
    tags:
      - v*
permissions:
  contents: read
jobs:
  install-scripts:
    name: Install scripts
    runs-on: ubuntu-latest
    steps:
    - name: Check out repository
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - name: Set up Go
      uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      with:
        go-version-file: 'go.mod'
    - name: ShellCheck
      run: shellcheck -s sh scripts/install/fleet.sh && shellcheck scripts/test-fleet-sh.sh
    - name: Fleet installer
      run: bash scripts/test-fleet-sh.sh
