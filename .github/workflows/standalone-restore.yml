name: Standalone restore
# Proves that a hosted-target device's backups restore with a pinned upstream
# `kopia` binary, driven only by what the printable recovery kit prints. If
# this ever fails, the recovery kit is no longer a recovery kit.
on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  standalone-restore:
    name: Restore with upstream kopia
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
    - name: Check out repository
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - name: Set up Go
      uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      with:
        go-version-file: 'go.mod'
    - name: Restore a hosted-target snapshot with upstream kopia
      run: bash scripts/standalone-restore-test.sh
      env:
        STANDALONE_RESTORE_LOGDIR: ${{ runner.temp }}/standalone-restore-logs
    # The kit page carries a repository password and a read key, but both
    # belong to a Fleet that was created in a temp dir on this runner and is
    # already gone; there is nothing left for them to open.
    - name: Upload the recovery kit and the logs
      if: failure()
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: standalone-restore-logs
        path: ${{ runner.temp }}/standalone-restore-logs
        if-no-files-found: warn
