# CodeRabbit configuration for WarpHold — https://docs.coderabbit.ai/reference/configuration
language: en-US
reviews:
  profile: chill
  request_changes_workflow: false
  high_level_summary: true
  poem: false
  auto_review:
    enabled: true
    drafts: false
  path_filters:
    - "!docs/superpowers/**"
    - "!**/*.dc.html"
    - "!.superpowers/**"
    - "!go.sum"
    - "!site/**"
  path_instructions:
    - path: "fleet/**"
      instructions: >-
        Security-critical control plane that escrows other people's backup keys.
        Flag any response or log line that could carry a secret, any SQL that is not
        parameterized, any endpoint missing an authorization check, and any raw
        internal error text returned to an unauthenticated caller.
    - path: "agent/**"
      instructions: >-
        Runs unattended on end-user machines. Flag writes outside the agent state and
        cache directories (the systemd user unit and the XDG autostart entry written by
        `agent install` are the sanctioned exceptions), secrets in logs, and anything that could leave the systemd
        unit in a restart loop or report a backup as successful when it was not.
    - path: "cli/**"
      instructions: >-
        Only files named command_fleet_*.go, command_agent_*.go and server_hooks.go are
        WarpHold's; everything else is upstream Kopia and must not be refactored.
chat:
  auto_reply: true
